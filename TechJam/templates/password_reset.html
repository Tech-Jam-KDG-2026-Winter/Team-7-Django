<div class="mobile-container">
    <div></div>
    <h2>パスワードの再設定</h2>
    <p class="description-text">登録したアカウントのメールアドレスに再設定したパスワードを送信します</p>

    <form method="post">
        {% csrf_token %}
        <div class="field-group">
            <span class="label">メールアドレス</span>
            <input type="email" name="email">
        </div>
        <button type="submit" class="btn-danger">送信</button>
    </form>
    <p class="info-text">送信後、自動でログイン画面に遷移いたします</p>
</div>
