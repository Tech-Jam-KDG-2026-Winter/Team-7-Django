{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>check</title>
  <link rel="stylesheet" href="{% static 'accounts/check.css' %}">
</head>

<body>

  <div class="page">
    <h1 class="page-title">登録内容確認</h1>

    <p class="message-text">下記のメールアドレスでアカウント作成してもよろしいですか</p>

    <form method="post" class="check-form">
      {% csrf_token %}

      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" readonly>
      </div>

      <button type="submit" class="primary-button">登録</button>
    </form>

    
  </div>
</body>
</html>
