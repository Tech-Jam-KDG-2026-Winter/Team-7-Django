<h1 class="page-title">ログイン</h1>

<p class="link-text">Don’t have an account? Sign Up</p>

<form method="post" class="signin-form">
  {% csrf_token %}

  <div class="form-group">
    <label for="email">メールアドレス</label>
    <input type="email" id="email" name="email">
  </div>

  <div class="form-group">
    <label for="password">パスワード</label>
    <input type="password" id="password" name="password">
  </div>

  <button type="submit" class="primary-button">ログイン</button>
</form>

<p class="link-text">Forgot Your Password?</p>

<div class="divider">
  <span>または</span>
</div>

<div class="social-login">
  <button type="button" class="google-login">Googleでログイン</button>
  <button type="button" class="facebook-login">Facebookでログイン</button>
</div>
