{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>新規登録</title>
  <link rel="stylesheet" href="{% static 'accounts/signup.css' %}">
</head>
<body>

  <header class="header-container">
    <a href="{% url 'accounts:login' %}" class="back-button">←</a>
    <h1 class="page-title">新規登録</h1>
  </header>
  
  <form method="post" class="signup-form">
    {% csrf_token %}

    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email">
    </div>
    <div class="form-group">
      <label2 for="password">パスワード</label2>
      <input type="password" id="password" name="password">
    </div>

    <button type="submit" class="primary-button">新規登録</button>
  </form>

  <div class="divider">
    <span>または</span>
  </div>

  <div class="social-login">
    <button type="button" class="google-login">
      <img src="{% static 'accounts/google-logo.png' %}" alt="Google Logo" class="social-logo">
      Googleでログイン
    </button>
    <button type="button" class="facebook-login">
      <img src="{% static 'accounts/facebook-logo.png' %}" alt="Facebook Logo" class="social-logo">
      Facebookでログイン
    </button>
  </div>
</body>
</html>
