{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>質問一覧</title>
    <link rel="stylesheet" href="{% static 'questions/questions.css' %}">
</head>
<body class="container">
    <header class="header">
        <h1 class="title">質問に答える</h1>
    </header>

    <form action="{% url 'questions_index' %}" method="post" class="form-wrapper">
        {% csrf_token %}
        
        <ul class="question-list">
            {% for question in questions %}
                <li class="question-card">
                    <p class="question-text">{{ question.content }}</p>
                    
                    <div class="answer-control">
                        <input type="radio" name="answer_{{ question.id }}" value="yes" id="yes_{{ question.id }}" class="radio-input">
                        <label for="yes_{{ question.id }}" class="btn-answer">はい</label>

                        <input type="radio" name="answer_{{ question.id }}" value="no" id="no_{{ question.id }}" class="radio-input">
                        <label for="no_{{ question.id }}" class="btn-answer">いいえ</label>
                    </div>
                </li>
            {% endfor %}
        </ul>

        <footer class="submit-footer">
            <button type="submit" class="btn-submit">診断結果を見る</button>
        </ul>
    </form>
</body>
</html>
